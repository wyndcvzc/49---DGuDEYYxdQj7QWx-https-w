<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书高清主图下载器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

        * {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3), 0 0 30px rgba(239, 68, 68, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .image-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .image-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .checkbox-custom {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .checkbox-custom:checked {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: #ef4444;
        }

        .checkbox-custom:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 2px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="text-white">
    <!-- 顶部状态栏 -->
    <div id="authBadge" class="fixed top-4 right-4 z-40 flex items-center gap-3 glass-card rounded-full px-4 py-2 fade-in hidden">
        <div id="authIcon" class="flex items-center justify-center w-7 h-7 rounded-full bg-white/5">
            <span id="authIconEmoji">👤</span>
        </div>
        <div class="flex flex-col leading-tight">
            <div class="flex items-center gap-2">
                <span id="authPlan" class="text-xs font-semibold text-gray-300">免费版</span>
            </div>
            <div id="authQuota" class="text-[11px] text-gray-500">加载中...</div>
        </div>
        <button
            id="authBtn"
            onclick="openActivateModal()"
            class="ml-1 text-xs font-semibold px-3 py-1 rounded-full bg-gradient-to-r from-yellow-500 to-orange-500 text-black hover:scale-105 transition-transform"
        >
            激活
        </button>
    </div>

    <!-- 激活弹窗 -->
    <div id="activateModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md fade-in">
            <div class="flex items-start justify-between mb-5">
                <div>
                    <h3 class="text-xl font-bold text-white mb-1">👑 升级为永久 PRO</h3>
                    <p class="text-sm text-gray-400">解锁无限解析与打包下载，永久使用</p>
                </div>
                <button onclick="closeActivateModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>

            <!-- 对比表 -->
            <div class="mb-5 rounded-xl bg-white/5 border border-white/5 text-sm overflow-hidden">
                <div class="grid grid-cols-3 bg-white/5 text-xs font-semibold text-gray-300">
                    <div class="p-3">功能</div>
                    <div class="p-3 text-center">免费版</div>
                    <div class="p-3 text-center text-yellow-400">PRO 版</div>
                </div>
                <div class="grid grid-cols-3 border-t border-white/5"><div class="p-3 text-gray-400">每日解析</div><div class="p-3 text-center">5 次</div><div class="p-3 text-center text-green-400">∞ 无限</div></div>
                <div class="grid grid-cols-3 border-t border-white/5"><div class="p-3 text-gray-400">每日打包下载</div><div class="p-3 text-center">3 次</div><div class="p-3 text-center text-green-400">∞ 无限</div></div>
                <div class="grid grid-cols-3 border-t border-white/5"><div class="p-3 text-gray-400">高清无水印</div><div class="p-3 text-center">✅</div><div class="p-3 text-center">✅</div></div>
                <div class="grid grid-cols-3 border-t border-white/5"><div class="p-3 text-gray-400">永久使用</div><div class="p-3 text-center">-</div><div class="p-3 text-center text-green-400">✅</div></div>
            </div>

            <!-- 机器码 -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-400 mb-2">您的机器码（发给作者算激活码）</label>
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="machineIdInput"
                        readonly
                        class="flex-1 bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm font-mono text-white outline-none cursor-pointer select-all"
                        onclick="this.select()"
                        title="点击全选后 Ctrl+C 复制"
                    >
                    <button
                        onclick="copyMachineId()"
                        class="btn-secondary px-4 py-2.5 rounded-lg text-xs font-medium"
                    >复制</button>
                </div>
            </div>

            <!-- 激活码 -->
            <div class="mb-5">
                <label class="block text-xs font-medium text-gray-400 mb-2">激活码</label>
                <input
                    type="text"
                    id="activationInput"
                    placeholder="粘贴激活码，如 XHSDL-XXXXXXXXXXXXXXXX"
                    class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 outline-none input-glow"
                >
            </div>

            <!-- 按钮 -->
            <div class="flex gap-3">
                <button
                    onclick="closeActivateModal()"
                    class="flex-1 btn-secondary py-2.5 rounded-lg text-sm text-gray-300"
                >稍后再说</button>
                <button
                    id="activateSubmitBtn"
                    onclick="submitActivate()"
                    class="flex-1 btn-primary py-2.5 rounded-lg text-sm text-white font-semibold"
                >立即激活</button>
            </div>

            <div class="mt-4 text-center text-xs text-gray-500">
                获取激活码请联系作者 · 一人一码绑定本机 · 永久有效
            </div>
        </div>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
        <!-- 标题区域 -->
        <div class="text-center mb-12 fade-in">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-white via-red-200 to-white bg-clip-text text-transparent">
                小红书高清主图下载器
            </h1>
            <p class="text-gray-400 text-lg">一键解析下载小红书笔记高清原图 · 无水印 · 无广告</p>
        </div>

        <!-- 输入区域 -->
        <div class="w-full max-w-3xl mb-8 fade-in" style="animation-delay: 0.1s;">
            <div class="glass-card rounded-2xl p-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <input
                            type="text"
                            id="urlInput"
                            placeholder="粘贴小红书笔记链接..."
                            class="w-full bg-black/30 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-gray-500 outline-none input-glow transition-all"
                        >
                    </div>
                    <div class="flex gap-3">
                        <button
                            id="pasteBtn"
                            onclick="pasteFromClipboard()"
                            class="btn-secondary px-5 py-4 rounded-xl text-gray-300 flex items-center gap-2"
                            title="智能识别剪贴板"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                            <span class="hidden md:inline">粘贴</span>
                        </button>
                        <button
                            id="parseBtn"
                            onclick="parseNote()"
                            class="btn-primary px-8 py-4 rounded-xl text-white font-semibold flex items-center gap-2"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <span>解析</span>
                        </button>
                    </div>
                </div>
                <!-- 状态提示 -->
                <div id="statusText" class="mt-4 text-center text-sm hidden"></div>
            </div>
        </div>

        <!-- 图片预览区域 -->
        <div id="previewSection" class="w-full max-w-5xl hidden">
            <div class="glass-card rounded-2xl p-6">
                <!-- 标题和计数 -->
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 id="noteTitle" class="text-xl font-semibold text-white mb-1"></h2>
                        <p id="imageCount" class="text-gray-400 text-sm"></p>
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 cursor-pointer text-gray-300">
                            <input type="checkbox" id="selectAll" class="checkbox-custom" checked onclick="toggleSelectAll()">
                            <span>全选</span>
                        </label>
                    </div>
                </div>

                <!-- 图片网格 -->
                <div id="imageGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-6">
                </div>

                <!-- 下载按钮 -->
                <div class="flex flex-col items-center gap-4">
                    <div class="flex gap-3">
                        <button
                            id="zipDownloadBtn"
                            onclick="downloadZip()"
                            class="btn-primary px-12 py-4 rounded-xl text-white font-semibold text-lg flex items-center gap-3"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                            </svg>
                            <span>打包下载 ZIP</span>
                        </button>
                    </div>
                    <!-- 进度条 -->
                    <div id="progressContainer" class="w-full max-w-md hidden">
                        <div class="flex justify-between text-sm text-gray-400 mb-2">
                            <span id="progressText">准备下载...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="w-full bg-black/30 rounded-full h-2">
                            <div id="progressBar" class="progress-bar h-2 rounded-full bg-gradient-to-r from-red-500 to-red-600" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ========== Freemium 鉴权状态 ==========
        const AUTH_STORAGE_KEY = "xhs_auth_v1";
        let authState = {
            machineId: "",
            activation: "",
            activated: false,
            remainParse: 5,
            remainZip: 3,
        };

        // 生成简单的浏览器指纹（纯前端，不依赖外部库）
        function buildFingerprint() {
            const parts = [
                screen.width + "x" + screen.height,
                screen.colorDepth,
                navigator.language || "",
                (navigator.languages || []).join(","),
                navigator.platform || "",
                navigator.userAgent || "",
                new Date().getTimezoneOffset(),
            ];
            try {
                // 加 canvas 指纹
                const canvas = document.createElement("canvas");
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext("2d");
                ctx.textBaseline = "top";
                ctx.font = "14px Arial";
                ctx.fillStyle = "#f60";
                ctx.fillRect(0, 0, 80, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("xhs-fp- fingerprint <canvas> 📌", 2, 2);
                parts.push(canvas.toDataURL().slice(-64));
            } catch (e) {}
            return parts.join("|");
        }

        // 保存到 localStorage
        function saveAuthState() {
            try {
                localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
                    machineId: authState.machineId,
                    activation: authState.activation,
                }));
            } catch (e) {}
        }

        function loadAuthState() {
            try {
                const raw = localStorage.getItem(AUTH_STORAGE_KEY);
                if (!raw) return;
                const obj = JSON.parse(raw);
                authState.machineId = obj.machineId || "";
                authState.activation = obj.activation || "";
            } catch (e) {}
        }

        // 渲染右上角徽章
        function renderAuthBadge() {
            const badge = document.getElementById("authBadge");
            const planEl = document.getElementById("authPlan");
            const quotaEl = document.getElementById("authQuota");
            const iconEmoji = document.getElementById("authIconEmoji");
            const btn = document.getElementById("authBtn");
            const iconBox = document.getElementById("authIcon");

            badge.classList.remove("hidden");

            if (authState.activated) {
                planEl.textContent = "PRO 会员";
                planEl.className = "text-xs font-bold bg-gradient-to-r from-yellow-300 to-orange-400 bg-clip-text text-transparent";
                quotaEl.textContent = "永久 · 无限使用";
                iconEmoji.textContent = "👑";
                iconBox.className = "flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-yellow-500/30 to-orange-500/30";
                btn.textContent = "已激活";
                btn.className = "ml-1 text-xs font-semibold px-3 py-1 rounded-full bg-white/10 text-green-400 cursor-default pointer-events-none";
            } else {
                planEl.textContent = "免费版";
                planEl.className = "text-xs font-semibold text-gray-300";
                quotaEl.textContent = "今日剩余：解析" + authState.remainParse + " 次 · 打包 " + authState.remainZip + " 次";
                iconEmoji.textContent = "👤";
                iconBox.className = "flex items-center justify-center w-7 h-7 rounded-full bg-white/5";
                btn.textContent = "激活";
                btn.className = "ml-1 text-xs font-semibold px-3 py-1 rounded-full bg-gradient-to-r from-yellow-500 to-orange-500 text-black hover:scale-105 transition-transform";
            }
        }

        // 从响应中同步配额
        function syncQuotaFromResp(data) {
            if (!data || !data.quota) return;
            if (typeof data.quota.activated === "boolean") authState.activated = data.quota.activated;
            if (typeof data.quota.remain_parse === "number") authState.remainParse = data.quota.remain_parse;
            if (typeof data.quota.remain_zip === "number") authState.remainZip = data.quota.remain_zip;
            renderAuthBadge();
        }

        // 构造 axios 默认 header（给后端配额校验用）
        function getAuthHeaders() {
            const h = {};
            if (authState.machineId) h["X-Machine-Id"] = authState.machineId;
            if (authState.activation) h["X-Activation"] = authState.activation;
            return h;
        }

        // 初始化机器码
        async function initAuth() {
            loadAuthState();

            if (!authState.machineId) {
                try {
                    const fp = buildFingerprint();
                    const resp = await axios.post("/api/auth/machine-id", { fingerprint: fp });
                    if (resp.data && resp.data.success) {
                        authState.machineId = resp.data.machine_id;
                        authState.activated = !!resp.data.activated;
                        authState.remainParse = typeof resp.data.remain_parse === "number" ? resp.data.remain_parse : 5;
                        authState.remainZip = typeof resp.data.remain_zip === "number" ? resp.data.remain_zip : 3;
                        saveAuthState();
                    }
                } catch (e) {
                    console.warn("initAuth failed:", e);
                }
            } else {
                // 已有 machineId，查一下今日状态
                try {
                    const payload = { machine_id: authState.machineId };
                    if (authState.activation) payload.activation = authState.activation;
                    const resp = await axios.post("/api/auth/status", payload);
                    if (resp.data && resp.data.success) {
                        authState.activated = !!resp.data.activated;
                        authState.remainParse = typeof resp.data.remain_parse === "number" ? resp.data.remain_parse : authState.remainParse;
                        authState.remainZip = typeof resp.data.remain_zip === "number" ? resp.data.remain_zip : authState.remainZip;
                        saveAuthState();
                    }
                } catch (e) {}
            }
            renderAuthBadge();
        }

        // ====== 弹窗控制 ======
        function openActivateModal() {
            const modal = document.getElementById("activateModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.getElementById("machineIdInput").value = authState.machineId || "生成中...";
            setTimeout(() => document.getElementById("activationInput").focus(), 100);
        }

        function closeActivateModal() {
            const modal = document.getElementById("activateModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            document.getElementById("activationInput").value = "";
        }

        function copyMachineId() {
            const input = document.getElementById("machineIdInput");
            input.select();
            try {
                document.execCommand("copy");
                showStatus("机器码已复制，发给作者即可获取激活码", "success");
            } catch (e) {
                showStatus("请手动 Ctrl+C 复制输入框内的机器码", "warning");
            }
        }

        async function submitActivate() {
            const code = document.getElementById("activationInput").value.trim();
            const btn = document.getElementById("activateSubmitBtn");
            if (!code) {
                showStatus("请输入激活码", "warning");
                return;
            }
            btn.disabled = true;
            btn.textContent = "校验中...";
            try {
                const resp = await axios.post("/api/auth/activate", {
                    machine_id: authState.machineId,
                    activation: code,
                });
                authState.activation = code;
                authState.activated = !!resp.data.activated;
                authState.remainParse = typeof resp.data.remain_parse === "number" ? resp.data.remain_parse : 99999;
                authState.remainZip = typeof resp.data.remain_zip === "number" ? resp.data.remain_zip : 99999;
                saveAuthState();
                renderAuthBadge();
                showStatus(resp.data.message || "激活成功！", "success");
                setTimeout(closeActivateModal, 800);
            } catch (err) {
                const msg = (err.response && err.response.data && err.response.data.message) || "激活失败，请检查激活码";
                showStatus(msg, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "立即激活";
            }
        }

        // ========== 业务逻辑 ==========
        let currentImages = [];
        let isDownloading = false;

        // 工具函数：显示状态提示
        function showStatus(message, type) {
            const statusEl = document.getElementById("statusText");
            statusEl.textContent = message;
            statusEl.classList.remove("hidden", "text-blue-400", "text-green-400", "text-red-400", "text-yellow-400");

            if (type === "success") {
                statusEl.classList.add("text-green-400");
            } else if (type === "error") {
                statusEl.classList.add("text-red-400");
            } else if (type === "warning") {
                statusEl.classList.add("text-yellow-400");
            } else {
                statusEl.classList.add("text-blue-400");
            }

            setTimeout(() => {
                statusEl.classList.add("hidden");
            }, 5000);
        }

        // 从剪贴板粘贴
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("urlInput").value = text;
                showStatus("已成功粘贴剪贴板内容", "success");
            } catch (err) {
                showStatus("无法访问剪贴板，请手动粘贴", "warning");
            }
        }

        // 解析笔记
        async function parseNote() {
            const urlInput = document.getElementById("urlInput");
            const parseBtn = document.getElementById("parseBtn");
            const url = urlInput.value.trim();

            if (!url) {
                showStatus("请输入小红书笔记链接", "warning");
                urlInput.focus();
                return;
            }

            if (!authState.machineId) {
                showStatus("系统初始化中，请稍候再试...", "warning");
                return;
            }

            // 更新按钮状态
            parseBtn.disabled = true;
            parseBtn.innerHTML = '<div class="loading-spinner"></div><span>解析中...</span>';
            showStatus("正在解析笔记，请稍候...", "info");

            try {
                const response = await axios.post(
                    "/api/parse",
                    { url: url },
                    { headers: getAuthHeaders() }
                );

                syncQuotaFromResp(response.data);

                if (response.data.success) {
                    currentImages = response.data.images || [];
                    const title = response.data.title || "未命名笔记";

                    document.getElementById("noteTitle").textContent = title;
                    document.getElementById("imageCount").textContent = "共 " + currentImages.length + " 张高清主图";
                    document.getElementById("selectAll").checked = true;

                    renderImageGrid();
                    document.getElementById("previewSection").classList.remove("hidden");
                    showStatus("解析成功！已获取 " + currentImages.length + " 张图片", "success");

                    // 滚动到预览区域
                    document.getElementById("previewSection").scrollIntoView({ behavior: "smooth", block: "start" });
                } else {
                    showStatus(response.data.message || "解析失败，未找到图片", "error");
                }
            } catch (err) {
                const respData = err.response && err.response.data;
                const message = (respData && respData.message) || "网络请求失败，请检查链接是否有效";
                syncQuotaFromResp(respData);
                // 配额超限：直接打开激活弹窗
                if (respData && respData.need_activate) {
                    showStatus(message, "warning");
                    setTimeout(openActivateModal, 400);
                } else {
                    showStatus(message, "error");
                }
            } finally {
                parseBtn.disabled = false;
                parseBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg><span>解析</span>';
            }
        }

        // 渲染图片网格
        function renderImageGrid() {
            const grid = document.getElementById("imageGrid");
            grid.innerHTML = "";

            currentImages.forEach(function(imgUrl, index) {
                const card = document.createElement("div");
                card.className = "image-card relative rounded-xl overflow-hidden bg-black/20 fade-in";
                card.style.animationDelay = index * 0.05 + "s";

                // 从 URL 提取文件名
                const urlParts = imgUrl.split("/");
                let fileName = urlParts[urlParts.length - 1] || "image_" + (index + 1);
                const extension = fileName.includes(".") ? fileName.split(".").pop() : "jpg";
                const safeName = "IMG_" + String(index + 1).padStart(3, "0") + "." + extension;

                const imgSrc = "/api/proxy?url=" + encodeURIComponent(imgUrl);

                card.innerHTML = '<div class="aspect-square relative group cursor-pointer" onclick="event.stopPropagation(); window.open(\'/api/proxy?url=' + encodeURIComponent(imgUrl) + '\', \'_blank\')">' +
                    '<img src="' + imgSrc + '" alt="图片 ' + (index + 1) + '" class="w-full h-full object-cover" loading="lazy">' +
                    '<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-center justify-center">' +
                        '<span class="opacity-0 group-hover:opacity-100 transition-opacity bg-black/60 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs text-white">🔍 点击查看大图</span>' +
                    '</div>' +
                    '<div class="absolute top-3 left-3" onclick="event.stopPropagation()"><input type="checkbox" class="checkbox-custom image-checkbox" data-index="' + index + '" checked></div>' +
                    '<div class="absolute bottom-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity"><span class="bg-black/60 backdrop-blur-sm px-2 py-1 rounded text-xs text-white">' + safeName + '</span></div>' +
                    '</div>';

                grid.appendChild(card);
            });
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const selectAll = document.getElementById("selectAll");
            const checkboxes = document.querySelectorAll(".image-checkbox");
            checkboxes.forEach(function(cb) { cb.checked = selectAll.checked; });
        }

        // 监听单个复选框变化
        document.addEventListener("change", function(e) {
            if (e.target.classList.contains("image-checkbox")) {
                const allCheckboxes = document.querySelectorAll(".image-checkbox");
                const selectAll = document.getElementById("selectAll");
                const checkedCount = document.querySelectorAll(".image-checkbox:checked").length;
                selectAll.checked = checkedCount === allCheckboxes.length;
            }
        });

        // 获取选中的图片
        function getSelectedImages() {
            const checkboxes = document.querySelectorAll(".image-checkbox:checked");
            return Array.from(checkboxes).map(function(cb) {
                return {
                    index: parseInt(cb.dataset.index),
                    url: currentImages[parseInt(cb.dataset.index)]
                };
            });
        }

        // 打包下载 ZIP（前端本地打包，避开网络拦截）
        async function downloadZip() {
            const selectedImages = getSelectedImages();

            if (selectedImages.length === 0) {
                showStatus("请至少选择一张图片进行打包下载", "warning");
                return;
            }

            if (!authState.machineId) {
                showStatus("系统初始化中，请稍候再试...", "warning");
                return;
            }

            if (isDownloading) {
                showStatus("正在下载中，请稍候...", "warning");
                return;
            }

            // 先请求一次后端 /api/export 预检配额（GET，不传 data 的预检用构造的空 payload）
            try {
                const prePayload = btoa(unescape(encodeURIComponent(JSON.stringify({ title: "_", images: [] }))));
                const preResp = await axios.get("/api/export", {
                    params: { data: prePayload },
                    headers: getAuthHeaders(),
                    validateStatus: function (s) { return s >= 200 && s < 600; },
                });
                // 400 才是正常（因为 images 为空），代表配额检查通过
                // 429 表示配额超限
                if (preResp.status === 429) {
                    syncQuotaFromResp(preResp.data);
                    showStatus((preResp.data && preResp.data.message) || "今日打包下载次数已用完", "warning");
                    setTimeout(openActivateModal, 400);
                    return;
                }
                syncQuotaFromResp(preResp.data);
            } catch (e) {
                // 网络错误不拦截，让后续实际流程决定
            }

            isDownloading = true;
            const zipBtn = document.getElementById("zipDownloadBtn");
            const progressContainer = document.getElementById("progressContainer");
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");
            const progressPercent = document.getElementById("progressPercent");

            zipBtn.disabled = true;
            zipBtn.innerHTML = '<div class="loading-spinner"></div><span>下载中...</span>';
            progressContainer.classList.remove("hidden");

            try {
                const title = document.getElementById("noteTitle").textContent || "xiaohongshu_images";
                const zip = new JSZip();
                let successCount = 0;
                let failCount = 0;

                for (let i = 0; i < selectedImages.length; i++) {
                    const item = selectedImages[i];
                    const percent = Math.round(((i + 1) / selectedImages.length) * 90);

                    progressText.textContent = "正在下载第 " + (i + 1) + " / " + selectedImages.length + " 张图片...";
                    progressBar.style.width = percent + "%";
                    progressPercent.textContent = percent + "%";

                    try {
                        const resp = await axios.get("/api/proxy?url=" + encodeURIComponent(item.url), {
                            responseType: "blob",
                            timeout: 60000
                        });

                        const ext = getImageExtension(item.url, resp.headers.get("content-type", ""));
                        const fileName = "IMG_" + String(i + 1).padStart(3, "0") + "." + ext;
                        zip.file(fileName, resp.data);
                        successCount++;
                    } catch (err) {
                        // 代理失败时，尝试直接获取图片（可能被 CORS 阻止）
                        try {
                            const directResp = await axios.get(item.url, {
                                responseType: "blob",
                                timeout: 30000,
                                headers: { "Referer": "https://www.xiaohongshu.com/" }
                            });
                            const ext = getImageExtension(item.url, directResp.headers.get("content-type", ""));
                            const fileName = "IMG_" + String(i + 1).padStart(3, "0") + "." + ext;
                            zip.file(fileName, directResp.data);
                            successCount++;
                        } catch (err2) {
                            failCount++;
                        }
                    }
                }

                progressText.textContent = "正在打包 ZIP 文件...";
                progressBar.style.width = "95%";
                progressPercent.textContent = "95%";

                const blob = await zip.generateAsync({ type: "blob" });

                progressBar.style.width = "100%";
                progressText.textContent = "打包完成！";
                progressPercent.textContent = "100%";

                const asciiTitle = title.replace(/[^\x20-\x7E]/g, "") || "xiaohongshu_images";
                const blobUrl = URL.createObjectURL(blob);

                // 直接在新标签页打开
                window.open(blobUrl, "_blank");

                setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 10000);

                showStatus(
                    "打包完成！成功 " + successCount + " 张" + (failCount > 0 ? "，失败 " + failCount + " 张" : ""),
                    failCount > 0 ? "warning" : "success"
                );

            } catch (err) {
                console.error("打包下载失败:", err);
                showStatus("打包下载失败：" + (err.message || "未知错误"), "error");
            } finally {
                isDownloading = false;
                zipBtn.disabled = false;
                zipBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg><span>打包下载 ZIP</span>';

                setTimeout(function() {
                    progressContainer.classList.add("hidden");
                    progressBar.style.width = "0%";
                }, 2000);
            }
        }

        // 根据 URL 或 Content-Type 推断文件扩展名
        function getImageExtension(url, contentType) {
            if (contentType.includes("png")) return "png";
            if (contentType.includes("webp")) return "webp";
            if (contentType.includes("gif")) return "gif";
            if (contentType.includes("jpeg") || contentType.includes("jpg")) return "jpg";
            // 从 URL 推断
            const match = url.match(/\.(\w+)(?:\?|$)/);
            if (match && ["jpg", "jpeg", "png", "webp", "gif"].includes(match[1].toLowerCase())) {
                return match[1].toLowerCase() === "jpeg" ? "jpg" : match[1].toLowerCase();
            }
            return "jpg";
        }

        // 回车键快速解析
        document.getElementById("urlInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                parseNote();
            }
        });

        // 启动时：初始化鉴权 + 检测剪贴板
        document.addEventListener("DOMContentLoaded", async function() {
            // 先启动鉴权
            initAuth();
            // 顺便检测剪贴板
            try {
                const text = await navigator.clipboard.readText();
                if (text && (text.includes("xiaohongshu.com") || text.includes("xhslink.com"))) {
                    document.getElementById("urlInput").value = text;
                    showStatus("已自动识别剪贴板中的小红书链接", "info");
                }
            } catch (err) {
                // 忽略剪贴板访问错误
            }
        });
    </script>
</body>
